; PID 1 for Railway: per-process autorestart.
; Worker crash must not take down web (and vice versa).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:web]
; Dual-stack bind: :: accepts both IPv6 and IPv4 (Linux default bindv6only=0).
; Docker healthcheck probes http://localhost:8000 which resolves to ::1 first;
; binding IPv4-only (0.0.0.0) made the probe fail with connection refused.
; Fallback to 0.0.0.0 if the container has no IPv6.
command=bash -c 'python -m uvicorn app.main:app --host :: --port "${PORT:-8000}" || exec python -m uvicorn app.main:app --host 0.0.0.0 --port "${PORT:-8000}"'
directory=%(here)s
environment=SCRAPE_ROLE="web"
autorestart=true
startsecs=2
startretries=100
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

; Delay worker so web finishes Store._init / WAL first on a cold volume mount.
[program:worker]
command=bash -c "sleep 20 && exec python -m app.scrape_worker"
directory=%(here)s
environment=SCRAPE_ROLE="worker"
autorestart=true
startsecs=25
startretries=100
stopwaitsecs=25
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
