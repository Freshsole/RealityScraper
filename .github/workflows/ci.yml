name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt
      - name: Compile + unit tests (incl. regex safety)
        run: make check test
      - name: perf-quick
        run: make perf-quick
        env:
          PYTHON: .venv/bin/python
