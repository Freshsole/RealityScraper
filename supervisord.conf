; PID 1 for Railway: per-process autorestart.
; Worker crash must not take down web (and vice versa).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:web]
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=%(here)s
environment=SCRAPE_ROLE="web"
autorestart=true
startsecs=2
startretries=100
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

; Delay worker so web finishes Store._init / WAL first on a cold volume mount.
[program:worker]
command=bash -c "sleep 20 && exec python -m app.scrape_worker"
directory=%(here)s
environment=SCRAPE_ROLE="worker"
autorestart=true
startsecs=25
startretries=100
stopwaitsecs=25
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
