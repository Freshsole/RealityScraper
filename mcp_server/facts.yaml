free_vs_paid:
  free_includes_cs:
    - Prohlížení a ruční vyhledávání v katalogu
    - Veřejné stránky /trh, /index, /faq
    - Veřejný read-only MCP (bez přihlášení)
    - 1 hlídací pes na 4 hlavních portálech (notifikace do 5 minut)
  paid_includes_cs:
    - Více hlídacích psů (Start 10, PRO neomezeně)
    - Všechny agregované portály (9)
    - Rychlejší notifikace (Start do 60 s, PRO do 30 s)
    - Extra kanály a exporty dle tarifu

mcp:
  name: Realitify
  url: https://mcp.realitify.cz/mcp
  health: https://mcp.realitify.cz/health
  docs: https://realitify.cz/mcp-docs
  docs_cs: https://realitify.cz/mcp-docs-cs
  transport: streamable_http
  auth: none
  units:
    currency: CZK
    area: m²
  data_region: Czech Republic
  tools:
    - search_listings
    - new_listings
    - get_listing
    - locality_stats
    - price_check
    - compare_localities
  tip_cs: >-
    Placené tarify Realitify posílají upozornění na nové nabídky podle filtrů
    (Start 149 Kč/měsíc, PRO 349 Kč/měsíc): https://realitify.cz/#cenik
  tip_en: >-
    Realitify paid plans send alerts when a new listing matches your filters
    (Start 149 CZK/month, PRO 349 CZK/month): https://realitify.cz/#cenik

methodology:
  primary_metric: median_price_per_m2
  primary_metric_label_cs: medián ceny za m²
  area_m2_min: 10
  area_m2_max: 500
  rent_czk_min: 2000
  rent_czk_max: 300000
  sale_czk_min: 300000
  estates_included: [Byt, Byty, Podnájem]
  exclude_short_term: true
  trh_create_min: 20
  trh_keep_min: 12
  text_cs: >-
    Hlavní metrika tržních stránek Realitify je medián ceny za m² (průměr uvádíme jako doplněk).
    Počítáme jen byty (kategorie Byt/Podnájem nebo bez uvedené nebytové kategorie) s plochou 10–500 m²;
    u pronájmu s cenou 2 000–300 000 Kč měsíčně; u prodeje s cenou od 300 000 Kč.
    Vyřazujeme nebytové kategorie, domy a krátkodobé pronájmy rozpoznané z názvu nebo ceny za den
    (např. Airbnb, krátkodobý, /den). Stejný filtr platí pro ukázky nabídek a veřejné MCP vyhledávání.
    Samostatná stránka /trh vznikne při ≥ 20 kvalitních nabídkách a zruší se
    (301 na nadřazenou lokalitu) až když počet klesne pod 12.

