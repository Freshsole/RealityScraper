<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Přihlášení — REALITIFY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/site/site.css" />
    <link rel="stylesheet" href="/static/site/auth.css?v=1.2.0-n3" />
  </head>
  <body class="auth-page">
    <div class="auth-glow auth-glow-1"><img src="/static/site/assets/auth-glow-1.svg" width="400" height="400" alt="" /></div>
    <div class="auth-glow auth-glow-2"><img src="/static/site/assets/auth-glow-2.svg" width="500" height="500" alt="" /></div>
    <div class="auth-stack">
      <a class="auth-logo" href="/">
        <span class="icon" style="width:20px;height:20px"><img src="/static/site/assets/auth-logo.svg" width="20" height="20" alt="" /></span>
        REALITIFY
      </a>
      <form class="auth-card" id="login-form">
        <div class="auth-head">
          <h1 class="auth-h">PŘIHLÁŠENÍ</h1>
          <p class="auth-lead">Vítejte zpět! Zadejte své údaje pro přístup k účtu.</p>
        </div>
        <div class="auth-fields">
          <div class="field">
            <label for="email">E-mailová adresa</label>
            <div class="field-input">
              <input id="email" name="email" type="email" placeholder="např. jan.novak@email.cz" autocomplete="username" required />
            </div>
          </div>
          <div class="field">
            <label for="password">Heslo</label>
            <div class="field-input">
              <input id="password" name="password" type="password" autocomplete="current-password" required />
              <button class="pw-toggle" type="button">
                <span class="icon" style="width:16px;height:16px">
                  <img class="eye-open" src="/static/site/assets/eye.svg" width="16" height="16" alt="" />
                  <img class="eye-closed" src="/static/site/assets/eye-closed.svg" width="16" height="16" alt="" />
                </span>
                <span class="txt">Ukázat</span>
              </button>
            </div>
          </div>
          <div class="forgot-row"><a href="/heslo">Zapomenuté heslo?</a></div>
        </div>
        <button class="auth-btn" type="submit">
          Přihlásit se
          <span class="icon" style="width:16px;height:16px"><img src="/static/site/assets/auth-arrow-right.svg" width="16" height="16" alt="" /></span>
        </button>
        <div class="divider">
          <img src="/static/site/assets/auth-line.svg" width="180" height="2" alt="" />
          nebo
          <img src="/static/site/assets/auth-line.svg" width="180" height="2" alt="" />
        </div>
        <div class="socials">
          <a class="social" href="/prihlaseni">
            <span class="icon" style="width:18px;height:18px"><img src="/static/site/assets/google.svg" width="18" height="18" alt="" /></span>
            Google
          </a>
          <a class="social" href="/prihlaseni">
            <span class="icon" style="width:18px;height:18px"><img src="/static/site/assets/apple.svg" width="18" height="18" alt="" /></span>
            Apple
          </a>
        </div>
        <p class="auth-foot"><span>Nemáte účet?</span> <a href="/registrace">Zaregistrujte se</a></p>
      </form>
      <p class="auth-hint">Zpět k hlídání vašich vysněných nabídek.</p>
    </div>
    <script src="/static/site/auth.js?v=1.2.0-n2"></script>
    <script src="/static/t.js?v=2"></script>
  </body>
</html>
