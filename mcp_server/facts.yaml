# Single source of truth for AI-facing and public product facts.
# Do not invent numbers here — market stats come from the live catalog DB.

product:
  name: Realitify
  domain: realitify.cz
  since_year: 2025
  one_liner_cs: >-
    Realitify je agregátor nabídek bytů a domů z českých realitních portálů
    s prohlížením katalogu, tržními statistikami, hlídáním nových nabídek
    a veřejným read-only MCP konektorem.
  one_liner_en: >-
    Realitify is a Czech real-estate listing aggregator for apartments and houses,
    with catalog browsing, market stats, new-listing alerts, and a public read-only MCP connector.
  disclaimer_cs: >-
    Realitify (realitify.cz) nesouvisí se společností Realtify ani PriceHubble.
  disclaimer_en: >-
    Realitify (realitify.cz) is not affiliated with Realtify or PriceHubble.

